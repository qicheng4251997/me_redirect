<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <!-- Fallback: redirect after 3 seconds when JavaScript is disabled -->
  <noscript><meta http-equiv="refresh" content="3;url=https://me99office.co/RFNSADS1"></noscript>
  <style>
    :root {
      --bg-1: #f6f8fb;
      --bg-2: #e6edf7;
      --ring: #d5deeb;
      --accent: #3b6df0;
      --text: #6b7a90;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #121823;
        --bg-2: #0b0f17;
        --ring: #263247;
        --accent: #6f9bff;
        --text: #8b9ab3;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(circle at 50% 40%, var(--bg-1), var(--bg-2));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    /* Spinner */
    .spinner {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid var(--ring);
      border-top-color: var(--accent);
      animation: spin 1s cubic-bezier(.55, .15, .45, .85) infinite;
    }
    .spinner::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom-color: var(--accent);
      opacity: .45;
      animation: spin 1.6s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Text */
    .label {
      margin: 0;
      font-size: 14px;
      letter-spacing: .2em;
      padding-left: .2em;
    }
    .dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    /* Thin progress bar at the top, fills in 3 seconds */
    .bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: var(--accent);
      transform-origin: left;
      transform: scaleX(0);
      animation: fill 3s linear forwards;
    }
    @keyframes fill { to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner, .spinner::after { animation-duration: 3s; }
      .dots::after { animation: none; content: "..."; }
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <p class="label">Redirecting<span class="dots"></span></p>

  <script>
    // Change the URL below to your destination
    var TARGET = "https://me99office.co/RFNSADS1";
    setTimeout(function () {
      window.location.replace(TARGET);
    }, 3000);
  </script>
</body>
</html>
